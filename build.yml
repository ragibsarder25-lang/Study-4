          package com.ragib.studyos.system

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.SystemClock
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import androidx.core.content.ContextCompat
          import com.ragib.studyos.MainActivity
          import com.ragib.studyos.domain.StudyRepository
          import dagger.hilt.android.AndroidEntryPoint
          import dagger.hilt.android.qualifiers.ApplicationContext
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import javax.inject.Inject
          import javax.inject.Singleton

          data class TimerUi(
              val state: String = "IDLE", // IDLE, RUNNING, PAUSED, FINISHED
              val remainingSec: Int = 0, val totalSec: Int = 0, val isBreak: Boolean = false,
              val taskId: Long? = null, val topicId: Long? = null, val title: String = "", val period: String = "MORNING"
          )

          const val A_START = "studyos.START"
          const val A_PAUSE = "studyos.PAUSE"
          const val A_RESUME = "studyos.RESUME"
          const val A_STOP = "studyos.STOP"

          @Singleton
          class TimerController @Inject constructor(@ApplicationContext private val ctx: Context) {
              val state = MutableStateFlow(TimerUi())

              fun start(taskId: Long?, topicId: Long?, title: String, period: String, seconds: Int, isBreak: Boolean = false) {
                  ContextCompat.startForegroundService(ctx, Intent(ctx, TimerService::class.java).setAction(A_START)
                      .putExtra("task", taskId ?: -1L).putExtra("topic", topicId ?: -1L).putExtra("title", title)
                      .putExtra("period", period).putExtra("sec", seconds).putExtra("break", isBreak))
              }
              private fun cmd(a: String) { ctx.startService(Intent(ctx, TimerService::class.java).setAction(a)) }
              fun pause() = cmd(A_PAUSE)
              fun resume() = cmd(A_RESUME)
              fun stop() = cmd(A_STOP)
              fun reset() { state.value = TimerUi() }
          }

          fun fmtTime(sec: Int): String = "%02d:%02d".format(sec / 60, sec % 60)

          @AndroidEntryPoint
          class TimerService : Service() {
              @Inject lateinit var timer: TimerController
              @Inject lateinit var repo: StudyRepository
              @Inject lateinit var notifier: Notifier

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)
              private val io = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private var ticker: Job? = null
              private var endAt = 0L
              private var remainingMs = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      A_START -> intent?.let { start(it) }
                      A_PAUSE -> pause()
                      A_RESUME -> resume()
                      A_STOP -> stopSession()
                      else -> if (timer.state.value.state == "IDLE") stopSelf()
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() { scope.cancel(); super.onDestroy() }

              private fun start(i: Intent) {
                  val total = i.getIntExtra("sec", 60).coerceAtLeast(1)
                  val s = TimerUi("RUNNING", total, total, i.getBooleanExtra("break", false),
                      i.getLongExtra("task", -1L).takeIf { it >= 0 }, i.getLongExtra("topic", -1L).takeIf { it >= 0 },
                      i.getStringExtra("title") ?: "", i.getStringExtra("period") ?: "MORNING")
                  remainingMs = total * 1000L
                  timer.state.value = s
                  ServiceCompat.startForeground(this, 100, buildNotif(s), if (Build.VERSION.SDK_INT >= 34) ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE else 0)
                  runTicker()
              }

              private fun runTicker() {
                  ticker?.cancel()
                  endAt = SystemClock.elapsedRealtime() + remainingMs
                  ticker = scope.launch {
                      while (isActive) {
                          val rem = endAt - SystemClock.elapsedRealtime()
                          if (rem <= 0) { finish(); break }
                          timer.state.value = timer.state.value.copy(remainingSec = ((rem + 999) / 1000).toInt())
                          delay(250)
                      }
                  }
              }

              private fun pause() {
                  val s = timer.state.value
                  if (s.state != "RUNNING") return
                  ticker?.cancel()
                  remainingMs = maxOf(0L, endAt - SystemClock.elapsedRealtime())
                  val n = s.copy(state = "PAUSED", remainingSec = ((remainingMs + 999) / 1000).toInt())
                  timer.state.value = n; refreshNotif(n)
              }

              private fun resume() {
                  val s = timer.state.value
                  if (s.state != "PAUSED") return
                  val n = s.copy(state = "RUNNING"); timer.state.value = n
                  runTicker(); refreshNotif(n)
              }

              private fun finish() {
                  val s = timer.state.value
                  timer.state.value = s.copy(state = "FINISHED", remainingSec = 0)
                  io.launch {
                      repo.recordSession(s.taskId, s.topicId, s.totalSec, s.totalSec, true, s.isBreak)
                      notifier.post(101, if (s.isBreak) "Break over" else "Session complete",
                          if (s.isBreak) "Time to get back to it." else "${s.title} — well done. Open the app to rate your understanding.", s.period, false)
                  }
                  stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }

              private fun stopSession() {
                  val s = timer.state.value
                  ticker?.cancel()
                  val spent = s.totalSec - s.remainingSec
                  if (s.state == "RUNNING" || s.state == "PAUSED") {
                      if (spent >= 10) io.launch { repo.recordSession(s.taskId, s.topicId, s.totalSec, spent, false, s.isBreak) }
                  }
                  timer.state.value = TimerUi()
                  stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }

              private fun svc(a: String, rc: Int) = PendingIntent.getService(this, rc, Intent(this, TimerService::class.java).setAction(a),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)

              private fun refreshNotif(s: TimerUi) { getSystemService(NotificationManager::class.java).notify(100, buildNotif(s)) }

              private fun buildNotif(s: TimerUi): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel("timer") == null)
                      nm.createNotificationChannel(NotificationChannel("timer", "Study timer", NotificationManager.IMPORTANCE_LOW))
                  val open = PendingIntent.getActivity(this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val b = NotificationCompat.Builder(this, "timer").setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(if (s.isBreak) "Break" else s.title.ifEmpty { "Study session" })
                      .setContentIntent(open).setOngoing(true).setOnlyAlertOnce(true)
                  if (s.state == "RUNNING") {
                      b.setUsesChronometer(true).setChronometerCountDown(true).setShowWhen(true)
                          .setWhen(System.currentTimeMillis() + s.remainingSec * 1000L).setContentText("Session running")
                      b.addAction(0, "Pause", svc(A_PAUSE, 1))
                  } else {
                      b.setContentText("Paused · ${fmtTime(s.remainingSec)}")
                      b.addAction(0, "Resume", svc(A_RESUME, 2))
                  }
                  b.addAction(0, "Stop", svc(A_STOP, 3))
                  return b.build()
              }
          }
