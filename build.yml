          package com.ragib.studyos.data

          import android.content.Context
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import dagger.hilt.android.qualifiers.ApplicationContext
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import org.json.JSONObject
          import javax.inject.Inject
          import javax.inject.Singleton

          data class Prefs(
              val morningStart: Int = 360, val eveningStart: Int = 1020, val nightStart: Int = 1260,
              val morningBudget: Int = 120, val eveningBudget: Int = 90, val nightBudget: Int = 40,
              val sessionMin: Int = 45, val breakMin: Int = 5,
              val intervals: List<Int> = listOf(1, 3, 5, 7), val revisionMin: Int = 10,
              val friday: Boolean = true, val maxTasks: Int = 10, val dailyLimit: Int = 300,
              val sound: String = "DEFAULT", val vibration: String = "NORMAL", val accent: Int = 0, val auto: Boolean = true
          )

          fun Prefs.toJson(): JSONObject = JSONObject().put("morningStart", morningStart).put("eveningStart", eveningStart)
              .put("nightStart", nightStart).put("morningBudget", morningBudget).put("eveningBudget", eveningBudget)
              .put("nightBudget", nightBudget).put("sessionMin", sessionMin).put("breakMin", breakMin)
              .put("intervals", intervals.joinToString(",")).put("revisionMin", revisionMin).put("friday", friday)
              .put("maxTasks", maxTasks).put("dailyLimit", dailyLimit).put("sound", sound).put("vibration", vibration)
              .put("accent", accent).put("auto", auto)

          fun JSONObject.toPrefs(): Prefs {
              val d = Prefs()
              return Prefs(
                  optInt("morningStart", d.morningStart), optInt("eveningStart", d.eveningStart), optInt("nightStart", d.nightStart),
                  optInt("morningBudget", d.morningBudget), optInt("eveningBudget", d.eveningBudget), optInt("nightBudget", d.nightBudget),
                  optInt("sessionMin", d.sessionMin), optInt("breakMin", d.breakMin),
                  optString("intervals", "1,3,5,7").split(",").mapNotNull { it.trim().toIntOrNull() }.ifEmpty { d.intervals },
                  optInt("revisionMin", d.revisionMin), optBoolean("friday", d.friday), optInt("maxTasks", d.maxTasks),
                  optInt("dailyLimit", d.dailyLimit), optString("sound", d.sound), optString("vibration", d.vibration),
                  optInt("accent", d.accent), optBoolean("auto", d.auto)
              )
          }

          private val Context.store by preferencesDataStore("studyos_prefs")

          @Singleton
          class PrefsRepository @Inject constructor(@ApplicationContext private val ctx: Context) {
              private val blob = stringPreferencesKey("json")

              val flow: Flow<Prefs> = ctx.store.data.map { p ->
                  p[blob]?.let { runCatching { JSONObject(it).toPrefs() }.getOrNull() } ?: Prefs()
              }

              suspend fun get(): Prefs = flow.first()

              suspend fun update(f: (Prefs) -> Prefs) {
                  val n = f(get())
                  ctx.store.edit { it[blob] = n.toJson().toString() }
              }
          }
          EOF_07
