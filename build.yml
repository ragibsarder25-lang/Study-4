          package com.ragib.studyos.ui

          import android.content.Context
          import android.net.Uri
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import com.ragib.studyos.data.*
          import com.ragib.studyos.domain.*
          import com.ragib.studyos.system.AlarmScheduler
          import com.ragib.studyos.system.TimerController
          import dagger.hilt.android.lifecycle.HiltViewModel
          import dagger.hilt.android.qualifiers.ApplicationContext
          import kotlinx.coroutines.ExperimentalCoroutinesApi
          import kotlinx.coroutines.FlowPreview
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.TextStyle
          import java.util.Locale
          import javax.inject.Inject

          data class TaskView(val task: DailyTaskEntity, val title: String, val subject: String, val difficulty: Int)

          fun parseTopics(raw: String, def: Int): List<Pair<String, Int>> = raw.lines().map { it.trim() }.filter { it.isNotEmpty() }.map { l ->
              val i = l.lastIndexOf("::")
              val n = if (i > 0) l.substring(i + 2).trim().toIntOrNull() else null
              if (n != null && n in 1..3) l.substring(0, i).trim() to n else l to def
          }

          @OptIn(ExperimentalCoroutinesApi::class, FlowPreview::class)
          @HiltViewModel
          class HomeViewModel @Inject constructor(
              private val repo: StudyRepository, private val scheduler: Scheduler, private val alarms: AlarmScheduler,
              private val prefsRepo: PrefsRepository, val timer: TimerController
          ) : ViewModel() {
              val day = MutableStateFlow(today())
              val prefs = prefsRepo.flow.stateIn(viewModelScope, SharingStarted.Eagerly, Prefs())
              val tasks: StateFlow<List<TaskView>> = day.flatMapLatest { d ->
                  combine(repo.tasksForDay(d), repo.topics(), repo.subjects()) { ts, tp, sb ->
                      val tm = tp.associateBy { it.id }; val sm = sb.associateBy { it.id }
                      ts.mapNotNull { t ->
                          val tpc = tm[t.topicId] ?: return@mapNotNull null
                          TaskView(t, tpc.title, sm[tpc.subjectId]?.name ?: "", tpc.difficulty)
                      }
                  }
              }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val undoCount = repo.undoCount().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), 0)
              val burst = MutableStateFlow(0 to Period.MORNING)
              val message = MutableSharedFlow<String>(extraBufferCapacity = 8)

              init {
                  viewModelScope.launch {
                      combine(repo.subjects(), repo.topics().map { it.size }.distinctUntilChanged(), prefsRepo.flow) { _, _, _ -> }
                          .debounce(400).collect { refreshNow() }
                  }
              }

              private suspend fun refreshNow() { val d = today(); day.value = d; scheduler.generate(d); alarms.scheduleAll() }
              fun refresh() { viewModelScope.launch { refreshNow() } }

              fun complete(id: Long, u: Int, period: String) = viewModelScope.launch {
                  repo.completeTask(id, u); burst.update { it.first + 1 to period }
              }
              fun start(t: TaskView) {
                  if (timer.state.value.state != "IDLE") { message.tryEmit("A session is already running"); return }
                  val sec = (t.task.plannedMin * 60 - t.task.spentSec).coerceAtLeast(300)
                  timer.start(t.task.id, t.task.topicId, t.title, t.task.period, sec)
              }
              fun quick(min: Int) {
                  if (timer.state.value.state != "IDLE") { message.tryEmit("A session is already running"); return }
                  timer.start(null, null, "Free session", currentPeriod(prefs.value), min * 60)
              }
              fun startBreak() {
                  timer.reset(); timer.start(null, null, "Break", Period.EVENING, prefs.value.breakMin * 60, true)
              }
              fun incomplete(id: Long, toDay: Long?) = viewModelScope.launch {
                  repo.markIncomplete(id, toDay)
                  message.tryEmit(if (toDay == null) "Saved as incomplete — it will be rescheduled automatically" else "Rescheduled")
              }
              fun reschedule(id: Long, toDay: Long) = viewModelScope.launch { repo.reschedule(id, toDay); message.tryEmit("Rescheduled") }
              fun extra(topicId: Long, toDay: Long) = viewModelScope.launch { repo.scheduleExtra(topicId, toDay); message.tryEmit("Extra session added") }
              fun overwhelmed() = viewModelScope.launch {
                  val n = repo.overwhelmed(today())
                  message.tryEmit(if (n == 0) "Nothing to reduce — workload is already light" else "Moved $n lower-priority task(s) to tomorrow. Nothing deleted.")
              }
              fun undo() = viewModelScope.launch {
                  val l = repo.undoLast(); message.tryEmit(if (l == null) "Nothing to undo" else "Undone: $l")
              }
          }

          @HiltViewModel
          class LibraryViewModel @Inject constructor(private val repo: StudyRepository) : ViewModel() {
              val subjects = repo.subjects().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val topics = repo.topics().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              fun addSubject(name: String, raw: String, diff: Int) = viewModelScope.launch { if (name.isNotBlank()) repo.addSubject(name, parseTopics(raw, diff)) }
              fun addTopics(sid: Long, raw: String, diff: Int) = viewModelScope.launch { repo.addTopics(sid, parseTopics(raw, diff)) }
              fun activate(s: SubjectEntity, min: Int, period: String, prio: Int) = viewModelScope.launch {
                  repo.updateSubject(s.copy(active = true, dailyMin = min, period = period, priority = prio))
              }
              fun deactivate(s: SubjectEntity) = viewModelScope.launch { repo.updateSubject(s.copy(active = false)) }
              fun deleteSubject(s: SubjectEntity) = viewModelScope.launch { repo.deleteSubject(s) }
              fun saveTopic(t: TopicEntity) = viewModelScope.launch { repo.updateTopic(t) }
              fun deleteTopic(t: TopicEntity) = viewModelScope.launch { repo.deleteTopic(t) }
              fun addToToday(id: Long) = viewModelScope.launch { repo.addToToday(id) }
              fun extraTomorrow(id: Long) = viewModelScope.launch { repo.scheduleExtra(id, today() + 1) }
          }

          data class SubjectProg(val name: String, val learned: Int, val total: Int)
          data class StatsUi(
              val subjects: Int = 0, val topics: Int = 0, val learned: Int = 0, val needMore: Int = 0, val totalMin: Long = 0,
              val sessionsToday: Int = 0, val revisionsDone: Int = 0, val missed: Int = 0, val rescheduled: Int = 0,
              val week: List<Pair<String, Int>> = emptyList(), val perSubject: List<SubjectProg> = emptyList(),
              val understanding: List<Int> = listOf(0, 0, 0, 0), val log: List<String> = emptyList()
          )

          @HiltViewModel
          class StatsViewModel @Inject constructor(repo: StudyRepository) : ViewModel() {
              val ui: StateFlow<StatsUi> = combine(repo.subjects(), repo.topics(), repo.allTasks(), repo.sessions(), repo.history()) { sb, tp, ts, ss, hs ->
                  val zone = ZoneId.systemDefault(); val td = today()
                  fun dayOf(ms: Long) = Instant.ofEpochMilli(ms).atZone(zone).toLocalDate().toEpochDay()
                  val study = ss.filter { !it.isBreak }
                  val tm = tp.associateBy { it.id }
                  StatsUi(
                      subjects = sb.size, topics = tp.size, learned = tp.count { it.status == TopicStatus.LEARNED },
                      needMore = tp.count { it.understanding in 0..1 }, totalMin = study.sumOf { it.spentSec } / 60L,
                      sessionsToday = study.count { dayOf(it.startedAt) == td },
                      revisionsDone = hs.count { it.kind == TType.REVISE || it.kind == TType.WEEKLY },
                      missed = ts.count { it.status == TStatus.INCOMPLETE || it.status == TStatus.MOVED },
                      rescheduled = ts.count { it.status == TStatus.RESCHEDULED || it.status == TStatus.MOVED },
                      week = (6 downTo 0).map { i ->
                          val d = td - i
                          LocalDate.ofEpochDay(d).dayOfWeek.getDisplayName(TextStyle.SHORT, Locale.getDefault()) to
                              (study.filter { dayOf(it.startedAt) == d }.sumOf { it.spentSec } / 60)
                      },
                      perSubject = sb.map { s -> val l = tp.filter { it.subjectId == s.id }; SubjectProg(s.name, l.count { it.status == TopicStatus.LEARNED }, l.size) },
                      understanding = (0..3).map { u -> tp.count { it.understanding == u } },
                      log = ts.filter { it.status == TStatus.INCOMPLETE || it.status == TStatus.MOVED }.sortedByDescending { it.day }.take(8)
                          .map { "${tm[it.topicId]?.title ?: "?"} · ${LocalDate.ofEpochDay(it.day)} · ${it.spentSec / 60} min spent" }
                  )
              }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), StatsUi())
          }

          @HiltViewModel
          class SettingsViewModel @Inject constructor(
              private val prefsRepo: PrefsRepository, private val repo: StudyRepository,
              private val alarms: AlarmScheduler, @ApplicationContext private val ctx: Context
          ) : ViewModel() {
              val prefs = prefsRepo.flow.stateIn(viewModelScope, SharingStarted.Eagerly, Prefs())
              val status = MutableStateFlow("")
              fun update(f: (Prefs) -> Prefs) = viewModelScope.launch { prefsRepo.update(f); alarms.scheduleAll() }
              fun export(uri: Uri) = viewModelScope.launch {
                  status.value = try {
                      val json = repo.exportJson()
                      ctx.contentResolver.openOutputStream(uri, "wt")!!.use { it.write(json.toByteArray()) }
                      "Backup saved"
                  } catch (e: Exception) { "Export failed: ${e.message}" }
              }
              fun restore(uri: Uri) = viewModelScope.launch {
                  status.value = try {
                      val s = ctx.contentResolver.openInputStream(uri)!!.use { String(it.readBytes()) }
                      repo.importJson(s); alarms.scheduleAll(); "Backup restored"
                  } catch (e: Exception) { "Import failed: ${e.message}" }
              }
          }
