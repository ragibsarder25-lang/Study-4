          package com.ragib.studyos

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.core.content.ContextCompat
          import androidx.hilt.navigation.compose.hiltViewModel
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.compose.LifecycleEventEffect
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.currentBackStackEntryAsState
          import androidx.navigation.compose.rememberNavController
          import com.ragib.studyos.domain.U
          import com.ragib.studyos.ui.*
          import dagger.hilt.android.AndroidEntryPoint

          @AndroidEntryPoint
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { AppRoot() }
              }
          }

          @Composable
          fun AppRoot() {
              val home: HomeViewModel = hiltViewModel()
              val library: LibraryViewModel = hiltViewModel()
              val stats: StatsViewModel = hiltViewModel()
              val settings: SettingsViewModel = hiltViewModel()
              val prefs by home.prefs.collectAsStateWithLifecycle()
              StudyTheme(prefs.accent) {
                  val nav = rememberNavController()
                  val route = nav.currentBackStackEntryAsState().value?.destination?.route
                  val ctx = LocalContext.current
                  val perm = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) {}
                  LaunchedEffect(Unit) {
                      if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          perm.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  LifecycleEventEffect(Lifecycle.Event.ON_RESUME) { home.refresh() }
                  val snack = remember { SnackbarHostState() }
                  LaunchedEffect(Unit) { home.message.collect { snack.showSnackbar(it) } }
                  val ts by home.timer.state.collectAsStateWithLifecycle()
                  val burst by home.burst.collectAsStateWithLifecycle()

                  Scaffold(
                      containerColor = Color.Black,
                      snackbarHost = { SnackbarHost(snack) },
                      bottomBar = {
                          if (route != "focus") NavigationBar(containerColor = Color.Black) {
                              listOf(Triple("today", "Today", "◉"), Triple("library", "Library", "▤"), Triple("stats", "Progress", "◔"), Triple("settings", "Settings", "⚙")).forEach { (r, l, i) ->
                                  NavigationBarItem(selected = route == r, onClick = { nav.navigate(r) { launchSingleTop = true; popUpTo("today") } },
                                      icon = { Text(i) }, label = { Text(l) })
                              }
                          }
                      }
                  ) { pad ->
                      Box(Modifier.padding(pad).fillMaxSize()) {
                          NavHost(nav, "today") {
                              composable("today") { TodayScreen(home) { nav.navigate("focus") { launchSingleTop = true } } }
                              composable("focus") { FocusScreen(home) { nav.popBackStack() } }
                              composable("library") { LibraryScreen(library) }
                              composable("stats") { StatsScreen(stats) }
                              composable("settings") { SettingsScreen(settings) }
                          }
                          Burst(burst.first, periodColor(burst.second))
                      }
                  }

                  if (ts.state == "FINISHED") {
                      if (ts.isBreak) {
                          LaunchedEffect(ts) { home.timer.reset(); home.message.tryEmit("Break over — back to it") }
                      } else if (ts.taskId != null) {
                          RateDialog("Session complete: ${ts.title}", { u: Int -> home.complete(ts.taskId!!, u, ts.period); home.timer.reset() }, { home.timer.reset() }) {
                              TextButton({ home.startBreak() }) { Text("Start ${prefs.breakMin}-min break") }
                          }
                      } else {
                          AlertDialog(onDismissRequest = { home.timer.reset() }, containerColor = Panel, title = { Text("Session complete") },
                              text = { Text("Nice work.") },
                              confirmButton = { TextButton({ home.timer.reset() }) { Text("OK") } },
                              dismissButton = { TextButton({ home.startBreak() }) { Text("Start break") } })
                      }
                  }
              }
          }
          EOF_03
