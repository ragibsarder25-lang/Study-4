          package com.ragib.studyos.data

          import androidx.room.*
          import org.json.JSONArray
          import org.json.JSONObject

          @Entity(tableName = "subjects")
          data class SubjectEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val active: Boolean = false,
              val dailyMin: Int = 60,
              val period: String = "AUTO",
              val priority: Int = 2,
              val createdAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "topics",
              foreignKeys = [ForeignKey(SubjectEntity::class, ["id"], ["subjectId"], onDelete = ForeignKey.CASCADE)],
              indices = [Index("subjectId")]
          )
          data class TopicEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val subjectId: Long,
              val title: String,
              val difficulty: Int = 2,
              val orderIndex: Int = 0,
              val status: String = "NEW",
              val understanding: Int = -1,
              val learnedDay: Long = -1,
              val createdAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "tasks",
              foreignKeys = [ForeignKey(TopicEntity::class, ["id"], ["topicId"], onDelete = ForeignKey.CASCADE)],
              indices = [Index(value = ["topicId", "day", "type"], unique = true), Index("day")]
          )
          data class DailyTaskEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val topicId: Long,
              val day: Long,
              val period: String,
              val type: String,
              val plannedMin: Int,
              val spentSec: Int = 0,
              val status: String = "PENDING",
              val revisionId: Long? = null,
              val createdAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "revisions",
              foreignKeys = [ForeignKey(TopicEntity::class, ["id"], ["topicId"], onDelete = ForeignKey.CASCADE)],
              indices = [Index("topicId"), Index("dueDay")]
          )
          data class RevisionScheduleEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val topicId: Long,
              val dueDay: Long,
              val stage: Int,
              val done: Boolean = false,
              val doneDay: Long = -1
          )

          @Entity(tableName = "sessions", indices = [Index("startedAt")])
          data class StudySessionEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val taskId: Long?,
              val topicId: Long?,
              val startedAt: Long,
              val plannedSec: Int,
              val spentSec: Int,
              val completed: Boolean,
              val isBreak: Boolean
          )

          @Entity(tableName = "history", indices = [Index("day")])
          data class RevisionHistoryEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val topicId: Long,
              val day: Long,
              val stage: Int,
              val understanding: Int,
              val kind: String
          )

          @Entity(tableName = "undo")
          data class UndoEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val label: String,
              val payload: String,
              val hist: Boolean,
              val createdAt: Long = System.currentTimeMillis()
          )

          fun JSONArray.objs(): List<JSONObject> = (0 until length()).map { getJSONObject(it) }
          private fun JSONObject.longOrNull(k: String): Long? = if (isNull(k)) null else getLong(k)

          fun SubjectEntity.toJson(): JSONObject = JSONObject().put("id", id).put("name", name).put("active", active)
              .put("dailyMin", dailyMin).put("period", period).put("priority", priority).put("createdAt", createdAt)
          fun JSONObject.toSubject() = SubjectEntity(getLong("id"), getString("name"), getBoolean("active"), getInt("dailyMin"),
              getString("period"), getInt("priority"), getLong("createdAt"))

          fun TopicEntity.toJson(): JSONObject = JSONObject().put("id", id).put("subjectId", subjectId).put("title", title)
              .put("difficulty", difficulty).put("orderIndex", orderIndex).put("status", status)
              .put("understanding", understanding).put("learnedDay", learnedDay).put("createdAt", createdAt)
          fun JSONObject.toTopic() = TopicEntity(getLong("id"), getLong("subjectId"), getString("title"), getInt("difficulty"),
              getInt("orderIndex"), getString("status"), getInt("understanding"), getLong("learnedDay"), getLong("createdAt"))

          fun DailyTaskEntity.toJson(): JSONObject = JSONObject().put("id", id).put("topicId", topicId).put("day", day)
              .put("period", period).put("type", type).put("plannedMin", plannedMin).put("spentSec", spentSec)
              .put("status", status).put("revisionId", revisionId ?: JSONObject.NULL).put("createdAt", createdAt)
          fun JSONObject.toTask() = DailyTaskEntity(getLong("id"), getLong("topicId"), getLong("day"), getString("period"),
              getString("type"), getInt("plannedMin"), getInt("spentSec"), getString("status"), longOrNull("revisionId"), getLong("createdAt"))

          fun RevisionScheduleEntity.toJson(): JSONObject = JSONObject().put("id", id).put("topicId", topicId)
              .put("dueDay", dueDay).put("stage", stage).put("done", done).put("doneDay", doneDay)
          fun JSONObject.toRevision() = RevisionScheduleEntity(getLong("id"), getLong("topicId"), getLong("dueDay"),
              getInt("stage"), getBoolean("done"), getLong("doneDay"))

          fun StudySessionEntity.toJson(): JSONObject = JSONObject().put("id", id).put("taskId", taskId ?: JSONObject.NULL)
              .put("topicId", topicId ?: JSONObject.NULL).put("startedAt", startedAt).put("plannedSec", plannedSec)
              .put("spentSec", spentSec).put("completed", completed).put("isBreak", isBreak)
          fun JSONObject.toSession() = StudySessionEntity(getLong("id"), longOrNull("taskId"), longOrNull("topicId"),
              getLong("startedAt"), getInt("plannedSec"), getInt("spentSec"), getBoolean("completed"), getBoolean("isBreak"))

          fun RevisionHistoryEntity.toJson(): JSONObject = JSONObject().put("id", id).put("topicId", topicId).put("day", day)
              .put("stage", stage).put("understanding", understanding).put("kind", kind)
          fun JSONObject.toHistory() = RevisionHistoryEntity(getLong("id"), getLong("topicId"), getLong("day"),
              getInt("stage"), getInt("understanding"), getString("kind"))
