          @Composable
          fun GlowRing(progress: Float, color: Color, modifier: Modifier = Modifier, stroke: Dp = 10.dp, content: @Composable BoxScope.() -> Unit = {}) {
              val p by animateFloatAsState(progress.coerceIn(0f, 1f), tween(600), label = "ring")
              Box(modifier, contentAlignment = Alignment.Center) {
                  Canvas(Modifier.fillMaxSize().padding(stroke * 1.8f)) {
                      val s = stroke.toPx()
                      drawArc(color = color.copy(alpha = .12f), startAngle = 0f, sweepAngle = 360f, useCenter = false, style = Stroke(s))
                      if (p > 0f) {
                          for ((w, a) in listOf(3.2f to .05f, 2.2f to .09f, 1.5f to .15f))
                              drawArc(color = color.copy(alpha = a), startAngle = -90f, sweepAngle = 360f * p, useCenter = false, style = Stroke(s * w, cap = StrokeCap.Round))
                          drawArc(color = color, startAngle = -90f, sweepAngle = 360f * p, useCenter = false, style = Stroke(s, cap = StrokeCap.Round))
                      }
                  }
