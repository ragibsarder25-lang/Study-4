          package com.ragib.studyos.system

          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters
          import com.ragib.studyos.MainActivity
          import com.ragib.studyos.data.PrefsRepository
          import com.ragib.studyos.domain.*
          import dagger.hilt.EntryPoint
          import dagger.hilt.InstallIn
          import dagger.hilt.android.EntryPointAccessors
          import dagger.hilt.android.qualifiers.ApplicationContext
          import dagger.hilt.components.SingletonComponent
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.ZoneId
          import javax.inject.Inject
          import javax.inject.Singleton

          object Actions {
              const val FIRE = "com.ragib.studyos.FIRE"
              const val SNOOZE = "com.ragib.studyos.SNOOZE"
              const val DISMISS = "com.ragib.studyos.DISMISS"
          }

          @Singleton
          class AlarmScheduler @Inject constructor(@ApplicationContext private val ctx: Context, private val prefs: PrefsRepository) {
              private val am = ctx.getSystemService(AlarmManager::class.java)

              private fun pi(req: Int, period: String): PendingIntent = PendingIntent.getBroadcast(
                  ctx, req, Intent(ctx, AlarmReceiver::class.java).setAction(Actions.FIRE).putExtra("period", period).putExtra("nid", 200 + Period.all.indexOf(period)),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
              )

              private fun set(at: Long, pi: PendingIntent) {
                  if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
                  else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
              }

              suspend fun scheduleAll() {
                  val p = prefs.get()
                  Period.all.forEachIndexed { idx, per ->
                      val m = startOf(p, per)
                      var t = LocalDate.now().atTime(m / 60, m % 60)
                      if (!t.isAfter(LocalDateTime.now().plusSeconds(30))) t = t.plusDays(1)
                      set(t.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli(), pi(idx, per))
                  }
              }

              fun snooze(period: String, minutes: Int) {
                  set(System.currentTimeMillis() + minutes * 60_000L, pi(50 + Period.all.indexOf(period), period))
              }
          }

          @Singleton
          class Notifier @Inject constructor(@ApplicationContext private val ctx: Context, private val prefs: PrefsRepository) {
              private suspend fun channel(): String {
                  val p = prefs.get()
                  val id = "study_${p.sound}_${p.vibration}"
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel(id) == null) {
                      val ch = NotificationChannel(id, "Study reminders (${p.sound.lowercase()} / ${p.vibration.lowercase()})", NotificationManager.IMPORTANCE_HIGH)
                      when (p.sound) {
                          "SILENT" -> ch.setSound(null, null)
                          "ALARM" -> ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM),
                              AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                          else -> ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION),
                              AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).build())
                      }
                      val pat = when (p.vibration) {
                          "OFF" -> null
                          "LIGHT" -> longArrayOf(0, 120)
                          "STRONG" -> longArrayOf(0, 500, 200, 500, 200, 500)
                          else -> longArrayOf(0, 250, 150, 250)
                      }
                      if (pat == null) ch.enableVibration(false) else { ch.enableVibration(true); ch.vibrationPattern = pat }
                      nm.createNotificationChannel(ch)
                  }
                  return id
              }

              @SuppressLint("MissingPermission")
              suspend fun post(id: Int, title: String, text: String, period: String?, actions: Boolean) {
                  val nmc = NotificationManagerCompat.from(ctx)
                  if (!nmc.areNotificationsEnabled()) return
                  val open = PendingIntent.getActivity(ctx, 0,
                      Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val b = NotificationCompat.Builder(ctx, channel())
                      .setSmallIcon(android.R.drawable.ic_popup_reminder)
                      .setContentTitle(title).setContentText(text)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                      .setColor(periodArgb(period ?: Period.MORNING))
                      .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_REMINDER).setContentIntent(open)
                  if (actions) {
                      fun bc(a: String, rc: Int) = PendingIntent.getBroadcast(ctx, rc,
                          Intent(ctx, AlarmReceiver::class.java).setAction(a).putExtra("period", period ?: Period.MORNING).putExtra("nid", id),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      b.addAction(0, "Start Study", open)
                      b.addAction(0, "Snooze", bc(Actions.SNOOZE, id + 1000))
                      b.addAction(0, "Dismiss", bc(Actions.DISMISS, id + 2000))
                  }
                  try { nmc.notify(id, b.build()) } catch (_: SecurityException) {}
              }
          }

          @EntryPoint
          @InstallIn(SingletonComponent::class)
          interface WorkEntry {
              fun scheduler(): Scheduler
              fun alarms(): AlarmScheduler
              fun repo(): StudyRepository
              fun notifier(): Notifier
          }

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val e = EntryPointAccessors.fromApplication(context.applicationContext, WorkEntry::class.java)
                  val pending = goAsync()
                  val period = intent.getStringExtra("period") ?: Period.MORNING
                  val nid = intent.getIntExtra("nid", 200)
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          when (intent.action) {
                              Actions.FIRE -> {
                                  val day = today()
                                  e.scheduler().generate(day)
                                  val tasks = e.repo().tasksNow(day).filter { it.period == period && it.status == TStatus.PENDING }
                                  if (tasks.isNotEmpty()) {
                                      val first = e.repo().topicTitle(tasks.first().topicId)
                                      val msg: Pair<String, String> = when {
                                          tasks.any { it.type == TType.WEEKLY } -> Pair("Weekly Friday revision", "${tasks.size} topic(s) from this week are ready. Start with $first.")
                                          period == Period.NIGHT -> Pair("Night revision", "${tasks.size} quick revision(s) due. Start with $first.")
                                          tasks.any { it.type == TType.REVISE } -> Pair("Scheduled revision", "${tasks.size} revision(s) due. Start with $first.")
                                          else -> Pair("Study session starting", "${tasks.size} topic(s) planned. First: $first")
                                      }
                                      e.notifier().post(nid, msg.first, msg.second, period, true)
                                  }
                                  e.alarms().scheduleAll()
                              }
                              Actions.SNOOZE -> { NotificationManagerCompat.from(context).cancel(nid); e.alarms().snooze(period, 10) }
                              Actions.DISMISS -> NotificationManagerCompat.from(context).cancel(nid)
                          }
                      } finally { pending.finish() }
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val e = EntryPointAccessors.fromApplication(context.applicationContext, WorkEntry::class.java)
                  val pending = goAsync()
                  CoroutineScope(Dispatchers.IO).launch {
                      try { e.scheduler().generate(today()); e.alarms().scheduleAll() } finally { pending.finish() }
                  }
              }
          }

          class PlanWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              override suspend fun doWork(): Result {
                  val e = EntryPointAccessors.fromApplication(applicationContext, WorkEntry::class.java)
                  e.scheduler().generate(today())
                  e.alarms().scheduleAll()
                  return Result.success()
              }
          }
