          package com.ragib.studyos.data

          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface StudyDao {
              @Query("SELECT * FROM subjects ORDER BY createdAt") fun subjects(): Flow<List<SubjectEntity>>
              @Query("SELECT * FROM subjects") suspend fun subjectsNow(): List<SubjectEntity>
              @Insert suspend fun insertSubject(s: SubjectEntity): Long
              @Update suspend fun updateSubject(s: SubjectEntity)
              @Delete suspend fun deleteSubject(s: SubjectEntity)
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putSubjects(l: List<SubjectEntity>)

              @Query("SELECT * FROM topics ORDER BY subjectId, orderIndex, id") fun topics(): Flow<List<TopicEntity>>
              @Query("SELECT * FROM topics") suspend fun topicsNow(): List<TopicEntity>
              @Query("SELECT * FROM topics WHERE id=:id") suspend fun topic(id: Long): TopicEntity?
              @Query("SELECT COALESCE(MAX(orderIndex),0) FROM topics WHERE subjectId=:sid") suspend fun maxOrder(sid: Long): Int
              @Insert suspend fun insertTopics(l: List<TopicEntity>)
              @Update suspend fun updateTopic(t: TopicEntity)
              @Delete suspend fun deleteTopic(t: TopicEntity)
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putTopics(l: List<TopicEntity>)

              @Query("SELECT * FROM tasks WHERE day=:day ORDER BY id") fun tasksForDay(day: Long): Flow<List<DailyTaskEntity>>
              @Query("SELECT * FROM tasks WHERE day=:day ORDER BY id") suspend fun tasksForDayNow(day: Long): List<DailyTaskEntity>
              @Query("SELECT * FROM tasks ORDER BY day") fun allTasks(): Flow<List<DailyTaskEntity>>
              @Query("SELECT * FROM tasks") suspend fun tasksNow(): List<DailyTaskEntity>
              @Query("SELECT * FROM tasks WHERE id=:id") suspend fun task(id: Long): DailyTaskEntity?
              @Query("SELECT * FROM tasks WHERE topicId=:tid") suspend fun tasksOfTopic(tid: Long): List<DailyTaskEntity>
              @Query("SELECT * FROM tasks WHERE status='PENDING' AND day<:day") suspend fun stalePending(day: Long): List<DailyTaskEntity>
              @Query("SELECT * FROM tasks WHERE status='INCOMPLETE'") suspend fun incompleteNow(): List<DailyTaskEntity>
              @Insert(onConflict = OnConflictStrategy.IGNORE) suspend fun insertTask(t: DailyTaskEntity): Long
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putTasks(l: List<DailyTaskEntity>)
              @Update suspend fun updateTask(t: DailyTaskEntity)
              @Query("DELETE FROM tasks WHERE topicId=:tid") suspend fun deleteTasksOfTopic(tid: Long)

              @Query("SELECT * FROM revisions") suspend fun revisionsNow(): List<RevisionScheduleEntity>
              @Query("SELECT * FROM revisions WHERE done=0 AND dueDay<=:day") suspend fun dueRevisions(day: Long): List<RevisionScheduleEntity>
              @Query("SELECT * FROM revisions WHERE topicId=:tid") suspend fun revisionsOfTopic(tid: Long): List<RevisionScheduleEntity>
              @Query("SELECT * FROM revisions WHERE id=:id") suspend fun revision(id: Long): RevisionScheduleEntity?
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putRevision(r: RevisionScheduleEntity): Long
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putRevisions(l: List<RevisionScheduleEntity>)
              @Query("DELETE FROM revisions WHERE topicId=:tid") suspend fun deleteRevisionsOfTopic(tid: Long)

              @Insert suspend fun insertSession(s: StudySessionEntity): Long
              @Query("SELECT * FROM sessions ORDER BY startedAt DESC") fun sessions(): Flow<List<StudySessionEntity>>
              @Query("SELECT * FROM sessions") suspend fun sessionsNow(): List<StudySessionEntity>
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putSessions(l: List<StudySessionEntity>)

              @Insert suspend fun insertHistory(h: RevisionHistoryEntity): Long
              @Query("SELECT * FROM history ORDER BY id") fun history(): Flow<List<RevisionHistoryEntity>>
              @Query("SELECT * FROM history") suspend fun historyNow(): List<RevisionHistoryEntity>
              @Query("DELETE FROM history WHERE id=(SELECT MAX(id) FROM history WHERE topicId=:tid)") suspend fun deleteLastHistory(tid: Long)
              @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun putHistory(l: List<RevisionHistoryEntity>)

              @Insert suspend fun insertUndo(u: UndoEntity)
              @Query("SELECT * FROM undo ORDER BY id DESC LIMIT 1") suspend fun lastUndo(): UndoEntity?
              @Query("SELECT COUNT(*) FROM undo") fun undoCount(): Flow<Int>
              @Delete suspend fun deleteUndo(u: UndoEntity)
              @Query("DELETE FROM undo WHERE id NOT IN (SELECT id FROM undo ORDER BY id DESC LIMIT 20)") suspend fun trimUndo()

              @Query("DELETE FROM sessions") suspend fun clearSessions()
              @Query("DELETE FROM history") suspend fun clearHistory()
              @Query("DELETE FROM undo") suspend fun clearUndo()
              @Query("DELETE FROM tasks") suspend fun clearTasks()
              @Query("DELETE FROM revisions") suspend fun clearRevisions()
              @Query("DELETE FROM topics") suspend fun clearTopics()
              @Query("DELETE FROM subjects") suspend fun clearSubjects()
          }

          @Database(
              entities = [SubjectEntity::class, TopicEntity::class, DailyTaskEntity::class, RevisionScheduleEntity::class,
                  StudySessionEntity::class, RevisionHistoryEntity::class, UndoEntity::class],
              version = 1, exportSchema = false
          )
          abstract class AppDb : RoomDatabase() { abstract fun dao(): StudyDao }
