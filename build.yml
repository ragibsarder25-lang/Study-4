          package com.ragib.studyos.domain

          import androidx.room.withTransaction
          import com.ragib.studyos.data.*
          import java.time.DayOfWeek
          import java.time.LocalDate
          import javax.inject.Inject
          import javax.inject.Singleton

          @Singleton
          class Scheduler @Inject constructor(private val db: AppDb, private val dao: StudyDao, private val prefs: PrefsRepository) {

              /** Idempotent: safe to call any number of times for the same day. */
              suspend fun generate(day: Long) {
                  val p = prefs.get()
                  db.withTransaction {
                      dao.stalePending(day).forEach { dao.updateTask(it.copy(status = TStatus.INCOMPLETE)) }
                      if (!p.auto) return@withTransaction
                      val topics = dao.topicsNow().associateBy { it.id }
                      val subjects = dao.subjectsNow()
                      val tasks = dao.tasksForDayNow(day)
                          .filter { it.status == TStatus.PENDING || it.status == TStatus.DONE }.toMutableList()
                      var count = tasks.size
                      var minutes = tasks.sumOf { it.plannedMin }

                      suspend fun add(t: DailyTaskEntity): Boolean {
                          val empty = tasks.none { it.period == t.period }
                          val room = budget(p, t.period) - tasks.filter { it.period == t.period }.sumOf { it.plannedMin }
                          if (count >= p.maxTasks || minutes + t.plannedMin > p.dailyLimit) return false
                          if (!empty && room < t.plannedMin) return false
                          val id = dao.insertTask(t)
                          if (id < 0) return false
                          tasks.add(t.copy(id = id)); count++; minutes += t.plannedMin
                          return true
                      }

                      dao.incompleteNow().filter { it.day < day }.sortedBy { it.day }.forEach { old ->
                          if (topics[old.topicId] == null) return@forEach
                          val dup = tasks.any { it.topicId == old.topicId && it.type == old.type }
                          val ok = !dup && add(old.copy(id = 0, day = day, spentSec = 0, status = TStatus.PENDING, createdAt = System.currentTimeMillis()))
                          if (ok || dup) dao.updateTask(old.copy(status = TStatus.MOVED))
                      }

                      val isFriday = LocalDate.ofEpochDay(day).dayOfWeek == DayOfWeek.FRIDAY
                      val weekly: Set<Long> = if (p.friday && isFriday)
                          topics.values.filter { it.status == TopicStatus.LEARNED && it.learnedDay in (day - 6)..(day - 1) }.map { it.id }.toSet()
                      else emptySet()

                      dao.dueRevisions(day).sortedBy { it.dueDay }.forEach { r ->
                          if (topics[r.topicId] == null || r.topicId in weekly) return@forEach
                          add(DailyTaskEntity(topicId = r.topicId, day = day, period = Period.NIGHT, type = TType.REVISE,
                              plannedMin = p.revisionMin, revisionId = r.id))
                      }
                      weekly.forEach { tid ->
                          val open = dao.revisionsOfTopic(tid).firstOrNull { !it.done && it.dueDay <= day }
                          add(DailyTaskEntity(topicId = tid, day = day, period = Period.NIGHT, type = TType.WEEKLY,
                              plannedMin = p.revisionMin, revisionId = open?.id))
                      }

                      for (s in subjects.filter { it.active }.sortedByDescending { it.priority }) {
                          var left = s.dailyMin - tasks.filter {
                              (it.type == TType.LEARN || it.type == TType.PRACTICE) && topics[it.topicId]?.subjectId == s.id
                          }.sumOf { it.plannedMin }
                          val queue = topics.values.filter { it.subjectId == s.id && it.status == TopicStatus.NEW }.sortedBy { it.orderIndex }
                          for (t in queue) {
                              val min = minOf(duration(t.difficulty, p), s.dailyMin)
                              if (left < min) break
                              val first = when {
                                  s.period == Period.MORNING || s.period == Period.EVENING -> s.period
                                  t.difficulty >= 3 -> Period.MORNING
                                  else -> Period.EVENING
                              }
                              val order = listOf(first, if (first == Period.MORNING) Period.EVENING else Period.MORNING)
                              var placed = false
                              for (per in order) {
                                  val type = if (per == Period.MORNING) TType.LEARN else TType.PRACTICE
                                  if (add(DailyTaskEntity(topicId = t.id, day = day, period = per, type = type, plannedMin = min))) { placed = true; break }
                              }
                              if (!placed) break
                              dao.updateTopic(t.copy(status = TopicStatus.SCHEDULED)); left -= min
                          }
                      }
                  }
              }
          }
