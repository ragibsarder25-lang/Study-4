          package com.ragib.studyos.domain

          import androidx.room.withTransaction
          import com.ragib.studyos.data.*
          import org.json.JSONArray
          import org.json.JSONObject
          import javax.inject.Inject
          import javax.inject.Singleton
          import kotlin.math.ceil

          @Singleton
          class StudyRepository @Inject constructor(
              private val db: AppDb, private val dao: StudyDao, private val prefs: PrefsRepository
          ) {
              fun subjects() = dao.subjects()
              fun topics() = dao.topics()
              fun tasksForDay(d: Long) = dao.tasksForDay(d)
              fun allTasks() = dao.allTasks()
              fun sessions() = dao.sessions()
              fun history() = dao.history()
              fun undoCount() = dao.undoCount()
              suspend fun tasksNow(day: Long) = dao.tasksForDayNow(day)
              suspend fun topicTitle(id: Long) = dao.topic(id)?.title ?: ""

              // ---------- subjects / topics ----------
              suspend fun addSubject(name: String, topics: List<Pair<String, Int>>): Long = db.withTransaction {
                  val id = dao.insertSubject(SubjectEntity(name = name.trim()))
                  insertTopics(id, topics); id
              }
              suspend fun addTopics(subjectId: Long, topics: List<Pair<String, Int>>): Unit = db.withTransaction { insertTopics(subjectId, topics) }
              private suspend fun insertTopics(sid: Long, list: List<Pair<String, Int>>) {
                  var o = dao.maxOrder(sid)
                  dao.insertTopics(list.map { (t, d) -> o++; TopicEntity(subjectId = sid, title = t, difficulty = d, orderIndex = o) })
              }
              suspend fun updateSubject(s: SubjectEntity) = dao.updateSubject(s)
              suspend fun deleteSubject(s: SubjectEntity) = dao.deleteSubject(s)
              suspend fun updateTopic(t: TopicEntity) = dao.updateTopic(t)
              suspend fun deleteTopic(t: TopicEntity): Unit = db.withTransaction {
                  pushUndo("Deleted \"${t.title}\"", listOf(t.id), false); dao.deleteTopic(t)
              }

              suspend fun addToToday(topicId: Long): Unit = db.withTransaction {
                  val t = dao.topic(topicId) ?: return@withTransaction
                  val p = prefs.get()
                  pushUndo("Added \"${t.title}\" to today", listOf(t.id), false)
                  val learned = t.status == TopicStatus.LEARNED
                  val per = if (learned) Period.NIGHT else if (t.difficulty >= 3) Period.MORNING else Period.EVENING
                  val type = if (learned) TType.REVISE else if (per == Period.MORNING) TType.LEARN else TType.PRACTICE
                  val rev = if (learned) dao.revisionsOfTopic(t.id).firstOrNull { !it.done } else null
                  dao.insertTask(DailyTaskEntity(topicId = t.id, day = today(), period = per, type = type,
                      plannedMin = if (learned) p.revisionMin else duration(t.difficulty, p), revisionId = rev?.id))
                  if (t.status == TopicStatus.NEW) dao.updateTopic(t.copy(status = TopicStatus.SCHEDULED))
              }

              suspend fun scheduleExtra(topicId: Long, toDay: Long): Unit = db.withTransaction {
                  val t = dao.topic(topicId) ?: return@withTransaction
                  val p = prefs.get()
                  pushUndo("Extra session for \"${t.title}\"", listOf(t.id), false)
                  val per = if (t.difficulty >= 3) Period.MORNING else Period.EVENING
                  dao.insertTask(DailyTaskEntity(topicId = t.id, day = toDay, period = per,
                      type = if (per == Period.MORNING) TType.LEARN else TType.PRACTICE, plannedMin = duration(t.difficulty, p)))
                  if (t.status == TopicStatus.NEW) dao.updateTopic(t.copy(status = TopicStatus.SCHEDULED))
              }

              // ---------- completion + spaced repetition ----------
              private fun gap(base: Int, u: Int): Int = when (u) {
                  U.FULL -> ceil(base * 1.5).toInt()
                  U.DIFFICULT -> maxOf(1, base / 2)
                  else -> base
              }

              suspend fun completeTask(taskId: Long, u: Int): Unit = db.withTransaction {
                  val t = dao.task(taskId) ?: return@withTransaction
                  if (t.status == TStatus.DONE) return@withTransaction
                  val topic = dao.topic(t.topicId) ?: return@withTransaction
                  pushUndo("Completed \"${topic.title}\"", listOf(topic.id), true)
                  val p = prefs.get(); val today = today()
                  var stage = 0
                  dao.updateTask(t.copy(status = TStatus.DONE))
                  when (t.type) {
                      TType.LEARN, TType.PRACTICE -> {
                          if (topic.status == TopicStatus.LEARNED) {
                              dao.updateTopic(topic.copy(understanding = u))
                          } else if (u == U.NEED_MORE) {
                              dao.updateTopic(topic.copy(understanding = u))
                              dao.insertTask(t.copy(id = 0, day = today + 1, spentSec = 0, status = TStatus.PENDING, createdAt = System.currentTimeMillis()))
                          } else {
                              dao.updateTopic(topic.copy(status = TopicStatus.LEARNED, understanding = u, learnedDay = today))
                              dao.revisionsOfTopic(topic.id).filter { !it.done }.forEach { dao.putRevision(it.copy(done = true, doneDay = today)) }
                              stage = 1
                              dao.putRevision(RevisionScheduleEntity(topicId = topic.id, dueDay = today + gap(p.intervals.first(), u), stage = 1))
                          }
                      }
                      else -> {
                          val rev = t.revisionId?.let { dao.revision(it) } ?: dao.revisionsOfTopic(topic.id).firstOrNull { !it.done }
                          dao.updateTopic(topic.copy(understanding = u))
                          if (rev != null && !rev.done) {
                              stage = rev.stage
                              dao.putRevision(rev.copy(done = true, doneDay = today))
                              fun interval(s: Int) = p.intervals.getOrElse(s - 1) { p.intervals.last() }
                              val next = when (u) {
                                  U.FULL, U.PARTIAL -> rev.stage + 1
                                  else -> rev.stage
                              }
                              val g = when (u) {
                                  U.FULL -> gap(interval(next), U.FULL)
                                  U.PARTIAL -> interval(next)
                                  U.DIFFICULT -> gap(interval(next), U.DIFFICULT)
                                  else -> 1
                              }
                              val finished = u >= U.PARTIAL && next > p.intervals.size
                              if (!finished) dao.putRevision(RevisionScheduleEntity(topicId = topic.id, dueDay = today + g, stage = next))
                          }
                      }
                  }
                  dao.insertHistory(RevisionHistoryEntity(topicId = topic.id, day = today, stage = stage, understanding = u, kind = t.type))
                  Unit
              }

              // ---------- incomplete / reschedule / overwhelmed ----------
              private suspend fun moveTask(t: DailyTaskEntity, toDay: Long, status: String) {
                  if (toDay == t.day) return
                  dao.updateTask(t.copy(status = status))
                  dao.insertTask(t.copy(id = 0, day = toDay, status = TStatus.PENDING, spentSec = 0, createdAt = System.currentTimeMillis()))
                  t.revisionId?.let { id -> dao.revision(id)?.let { dao.putRevision(it.copy(dueDay = toDay)) } }
              }

              suspend fun markIncomplete(taskId: Long, toDay: Long?): Unit = db.withTransaction {
                  val t = dao.task(taskId) ?: return@withTransaction
                  pushUndo("Marked incomplete", listOf(t.topicId), false)
                  dao.updateTask(t.copy(status = TStatus.INCOMPLETE))
                  if (toDay != null) moveTask(t.copy(status = TStatus.INCOMPLETE), toDay, TStatus.MOVED)
              }

              suspend fun reschedule(taskId: Long, toDay: Long): Unit = db.withTransaction {
                  val t = dao.task(taskId) ?: return@withTransaction
                  pushUndo("Rescheduled", listOf(t.topicId), false)
                  moveTask(t, toDay, TStatus.RESCHEDULED)
              }

              suspend fun overwhelmed(day: Long): Int = db.withTransaction {
                  val pending = dao.tasksForDayNow(day).filter { it.status == TStatus.PENDING }
                  if (pending.size <= 1) return@withTransaction 0
                  fun prio(t: DailyTaskEntity) = when (t.type) { TType.REVISE -> 3; TType.LEARN, TType.WEEKLY -> 2; else -> 1 }
                  val sorted = pending.sortedWith(compareByDescending<DailyTaskEntity> { prio(it) }.thenBy { it.plannedMin })
                  val total = pending.sumOf { it.plannedMin }
                  var kept = 0
                  val keep = mutableSetOf<Long>()
                  for (t in sorted) if (keep.isEmpty() || kept + t.plannedMin <= total / 2) { keep.add(t.id); kept += t.plannedMin }
                  val move = pending.filter { it.id !in keep }
                  if (move.isEmpty()) return@withTransaction 0
                  pushUndo("I'm overwhelmed", move.map { it.topicId }, false)
                  move.forEach { moveTask(it, day + 1, TStatus.RESCHEDULED) }
                  move.size
              }

              suspend fun recordSession(taskId: Long?, topicId: Long?, plannedSec: Int, spentSec: Int, completed: Boolean, isBreak: Boolean): Unit =
                  db.withTransaction {
                      dao.insertSession(StudySessionEntity(taskId = taskId, topicId = topicId,
                          startedAt = System.currentTimeMillis() - spentSec * 1000L, plannedSec = plannedSec,
                          spentSec = spentSec, completed = completed, isBreak = isBreak))
                      if (!isBreak && taskId != null && spentSec > 0) dao.task(taskId)?.let { dao.updateTask(it.copy(spentSec = it.spentSec + spentSec)) }
                  }

              // ---------- undo ----------
              private suspend fun pushUndo(label: String, topicIds: List<Long>, hist: Boolean) {
                  val arr = JSONArray()
                  topicIds.distinct().forEach { id ->
                      val tp = dao.topic(id) ?: return@forEach
                      arr.put(JSONObject().put("topic", tp.toJson())
                          .put("tasks", JSONArray(dao.tasksOfTopic(id).map { it.toJson() }))
                          .put("revs", JSONArray(dao.revisionsOfTopic(id).map { it.toJson() })))
                  }
                  dao.insertUndo(UndoEntity(label = label, payload = arr.toString(), hist = hist))
                  dao.trimUndo()
              }

              suspend fun undoLast(): String? = db.withTransaction {
                  val u = dao.lastUndo() ?: return@withTransaction null
                  JSONArray(u.payload).objs().forEach { o ->
                      val topic = o.getJSONObject("topic").toTopic()
                      dao.putTopics(listOf(topic))
                      dao.deleteTasksOfTopic(topic.id); dao.deleteRevisionsOfTopic(topic.id)
                      dao.putTasks(o.getJSONArray("tasks").objs().map { it.toTask() })
                      dao.putRevisions(o.getJSONArray("revs").objs().map { it.toRevision() })
                      if (u.hist) dao.deleteLastHistory(topic.id)
                  }
                  dao.deleteUndo(u)
                  u.label
              }

              // ---------- backup ----------
              suspend fun exportJson(): String = JSONObject().put("app", "studyos").put("version", 1)
                  .put("exportedAt", System.currentTimeMillis())
                  .put("subjects", JSONArray(dao.subjectsNow().map { it.toJson() }))
                  .put("topics", JSONArray(dao.topicsNow().map { it.toJson() }))
                  .put("tasks", JSONArray(dao.tasksNow().map { it.toJson() }))
                  .put("revisions", JSONArray(dao.revisionsNow().map { it.toJson() }))
                  .put("sessions", JSONArray(dao.sessionsNow().map { it.toJson() }))
                  .put("history", JSONArray(dao.historyNow().map { it.toJson() }))
                  .put("prefs", prefs.get().toJson()).toString(2)

              suspend fun importJson(s: String) {
                  val o = JSONObject(s)
                  require(o.optString("app") == "studyos") { "Not a StudyOS backup" }
                  val subjects = o.getJSONArray("subjects").objs().map { it.toSubject() }
                  val topics = o.getJSONArray("topics").objs().map { it.toTopic() }
                  val tasks = o.getJSONArray("tasks").objs().map { it.toTask() }
                  val revs = o.getJSONArray("revisions").objs().map { it.toRevision() }
                  val sessions = o.getJSONArray("sessions").objs().map { it.toSession() }
                  val hist = o.getJSONArray("history").objs().map { it.toHistory() }
                  val pf = o.getJSONObject("prefs").toPrefs()
                  db.withTransaction {
                      dao.clearSessions(); dao.clearHistory(); dao.clearUndo(); dao.clearTasks()
                      dao.clearRevisions(); dao.clearTopics(); dao.clearSubjects()
                      dao.putSubjects(subjects); dao.putTopics(topics); dao.putTasks(tasks)
                      dao.putRevisions(revs); dao.putSessions(sessions); dao.putHistory(hist)
                  }
                  prefs.update { pf }
              }
          }
