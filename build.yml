          package com.ragib.studyos.domain

          import com.ragib.studyos.data.Prefs
          import java.time.LocalDate
          import java.time.LocalTime

          object Period {
              const val MORNING = "MORNING"; const val EVENING = "EVENING"; const val NIGHT = "NIGHT"
              val all = listOf(MORNING, EVENING, NIGHT)
          }
          object TType { const val LEARN = "LEARN"; const val PRACTICE = "PRACTICE"; const val REVISE = "REVISE"; const val WEEKLY = "WEEKLY" }
          object TStatus {
              const val PENDING = "PENDING"; const val DONE = "DONE"; const val INCOMPLETE = "INCOMPLETE"
              const val RESCHEDULED = "RESCHEDULED"; const val MOVED = "MOVED"
          }
          object TopicStatus { const val NEW = "NEW"; const val SCHEDULED = "SCHEDULED"; const val LEARNED = "LEARNED" }
          object U { const val NEED_MORE = 0; const val DIFFICULT = 1; const val PARTIAL = 2; const val FULL = 3 }

          fun today(): Long = LocalDate.now().toEpochDay()

          fun duration(diff: Int, p: Prefs): Int = when (diff) {
              3 -> p.sessionMin
              2 -> maxOf(15, p.sessionMin * 2 / 3)
              else -> maxOf(10, p.sessionMin / 2)
          }
          fun budget(p: Prefs, per: String): Int = when (per) {
              Period.MORNING -> p.morningBudget; Period.EVENING -> p.eveningBudget; else -> p.nightBudget
          }
          fun startOf(p: Prefs, per: String): Int = when (per) {
              Period.MORNING -> p.morningStart; Period.EVENING -> p.eveningStart; else -> p.nightStart
          }
          fun currentPeriod(p: Prefs): String {
              val n = LocalTime.now(); val m = n.hour * 60 + n.minute
              return when {
                  m >= p.morningStart && m < p.eveningStart -> Period.MORNING
                  m >= p.eveningStart && m < p.nightStart -> Period.EVENING
                  else -> Period.NIGHT
              }
          }
          fun periodArgb(p: String): Int = when (p) { Period.MORNING -> 0xFFB44CFF; Period.EVENING -> 0xFF00E5FF; else -> 0xFF3D7BFF }.toInt()
