          // ======================= FOCUS =======================
          @Composable
          fun FocusScreen(home: HomeViewModel, onExit: () -> Unit) {
              val s by home.timer.state.collectAsStateWithLifecycle()
              val color = if (s.isBreak) Cyan else periodColor(s.period)
              val view = LocalView.current
              DisposableEffect(Unit) { view.keepScreenOn = true; onDispose { view.keepScreenOn = false } }
              val pulse by rememberInfiniteTransition(label = "p").animateFloat(.65f, 1f, infiniteRepeatable(tween(1600), RepeatMode.Reverse), label = "a")
              Column(Modifier.fillMaxSize().background(Color.Black).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Row(Modifier.fillMaxWidth()) { TextButton(onExit) { Text("← Exit focus", color = Dim) } }
                  Spacer(Modifier.weight(1f))
                  if (s.state == "IDLE" || s.state == "FINISHED") {
                      Text("No active session", color = Dim)
                      Text("Start one from Today.", color = Dim, fontSize = 12.sp)
                  } else {
                      Text(if (s.isBreak) "Break" else s.title, fontSize = 22.sp, fontWeight = FontWeight.Light, letterSpacing = 1.sp)
                      Spacer(Modifier.height(24.dp))
                      val prog = if (s.totalSec == 0) 0f else 1f - s.remainingSec / s.totalSec.toFloat()
                      GlowRing(prog, color, Modifier.size(300.dp).alpha(if (s.state == "RUNNING") pulse else 1f), 10.dp) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(fmtTime(s.remainingSec), fontSize = 54.sp, fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Light)
                              Text(if (s.state == "PAUSED") "PAUSED" else "${(prog * 100).toInt()}%", color = color)
                          }
                      }
                      Spacer(Modifier.height(32.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          if (s.state == "RUNNING") NeonButton("Pause", color) { home.timer.pause() } else NeonButton("Resume", color) { home.timer.resume() }
                          NeonButton(if (s.isBreak) "Skip break" else "Stop", Dim) { home.timer.stop() }
                      }
                  }
                  Spacer(Modifier.weight(1f))
              }
          }

